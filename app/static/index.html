<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LecFaka Store - 插件商店</title>
    <meta name="description" content="LecFaka 官方插件商店 - 主题、支付接口、功能扩展一站式获取">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/store.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                </svg>
                <span>LecFaka Store</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link active">首页</a>
                <a href="#plugins" class="nav-link">插件</a>
                <a href="#" class="nav-link" id="nav-dashboard" style="display:none">控制台</a>
            </div>
            <div class="nav-actions">
                <div id="auth-guest" class="nav-auth-guest">
                    <button class="btn btn-ghost" onclick="showAuthModal('login')">登录</button>
                    <button class="btn btn-primary" onclick="showAuthModal('register')">注册</button>
                </div>
                <div id="auth-user" class="nav-auth-user" style="display:none">
                    <div class="user-dropdown" id="userDropdown">
                        <button class="user-btn" onclick="toggleDropdown()">
                            <div class="user-avatar" id="userAvatar">U</div>
                            <span id="userName">User</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="#" onclick="showDashboard('my-plugins')">我的插件</a>
                            <a href="#" onclick="showDashboard('domains')">域名管理</a>
                            <a href="#" onclick="showDashboard('orders')">订单记录</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" onclick="logout()" class="text-danger">退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero 区域 -->
    <section class="hero" id="hero">
        <div class="hero-bg">
            <div class="hero-gradient"></div>
            <div class="hero-grid"></div>
        </div>
        <div class="hero-content">
            <div class="hero-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>v2.0 全新上线</span>
            </div>
            <h1 class="hero-title">为你的发卡站<br><span class="gradient-text">注入超能力</span></h1>
            <p class="hero-desc">主题模板、支付接口、功能扩展 — 一站式获取，即装即用</p>
            <div class="hero-search">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="heroSearch" placeholder="搜索插件、主题、支付接口..." onkeydown="if(event.key==='Enter')searchPlugins()">
                <button class="btn btn-primary" onclick="searchPlugins()">搜索</button>
            </div>
            <div class="hero-stats">
                <div class="stat"><span class="stat-num" id="statPlugins">0</span><span class="stat-label">插件</span></div>
                <div class="stat-divider"></div>
                <div class="stat"><span class="stat-num" id="statUsers">0</span><span class="stat-label">用户</span></div>
                <div class="stat-divider"></div>
                <div class="stat"><span class="stat-num" id="statDownloads">0</span><span class="stat-label">安装</span></div>
            </div>
        </div>
    </section>

    <!-- 分类 -->
    <section class="categories" id="categories">
        <div class="container">
            <div class="category-grid">
                <button class="category-card active" data-type="all" onclick="filterByCategory(this, 'all')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span>全部</span>
                </button>
                <button class="category-card" data-type="theme" onclick="filterByCategory(this, 'theme')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <span>主题模板</span>
                </button>
                <button class="category-card" data-type="payment" onclick="filterByCategory(this, 'payment')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
                    <span>支付接口</span>
                </button>
                <button class="category-card" data-type="extension" onclick="filterByCategory(this, 'extension')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    <span>功能扩展</span>
                </button>
                <button class="category-card" data-type="free" onclick="filterByCategory(this, 'free')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                    <span>免费</span>
                </button>
            </div>
        </div>
    </section>

    <!-- 插件列表 -->
    <section class="plugins-section" id="plugins">
        <div class="container">
            <div class="section-header">
                <h2>精选插件</h2>
                <p class="section-desc">经过严格审核的高品质插件</p>
            </div>
            <div class="plugins-grid" id="pluginsGrid">
                <!-- JS 动态渲染 -->
            </div>
            <div class="loading-state" id="loadingState" style="display:none">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
            <div class="empty-state" id="emptyState" style="display:none">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15h8M9 9h.01M15 9h.01"/></svg>
                <p>暂无插件</p>
            </div>
        </div>
    </section>

    <!-- 用户控制台 (隐藏) -->
    <section class="dashboard-section" id="dashboardSection" style="display:none">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="sidebar-nav">
                        <a href="#" class="sidebar-link active" data-tab="my-plugins" onclick="switchDashTab(this, 'my-plugins')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
                            我的插件
                        </a>
                        <a href="#" class="sidebar-link" data-tab="domains" onclick="switchDashTab(this, 'domains')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                            域名管理
                        </a>
                        <a href="#" class="sidebar-link" data-tab="orders" onclick="switchDashTab(this, 'orders')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                            订单记录
                        </a>
                    </nav>
                </aside>
                <main class="dashboard-main" id="dashboardMain">
                    <!-- JS 动态渲染 -->
                </main>
            </div>
        </div>
    </section>

    <!-- 登录/注册弹窗 -->
    <div class="modal-overlay" id="authModal" style="display:none" onclick="if(event.target===this)closeAuthModal()">
        <div class="modal-card">
            <button class="modal-close" onclick="closeAuthModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <div class="modal-tabs">
                <button class="modal-tab active" id="tabLogin" onclick="switchAuthTab('login')">登录</button>
                <button class="modal-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</button>
            </div>

            <!-- 登录表单 -->
            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>邮箱或用户名</label>
                    <input type="text" id="loginAccount" placeholder="请输入邮箱或用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登录</button>
            </form>

            <!-- 注册表单 -->
            <form class="auth-form" id="registerForm" style="display:none" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" placeholder="请输入用户名" required minlength="2">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="regEmail" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="regBtn">注册</button>
            </form>

            <p class="auth-footer" id="authFooter">
                还没有账号？<a href="#" onclick="switchAuthTab('register')">立即注册</a>
            </p>
        </div>
    </div>

    <!-- 插件详情弹窗 -->
    <div class="modal-overlay" id="pluginModal" style="display:none" onclick="if(event.target===this)closePluginModal()">
        <div class="modal-card modal-lg">
            <button class="modal-close" onclick="closePluginModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <div id="pluginDetail">
                <!-- JS 动态渲染 -->
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container" id="toastContainer"></div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    <span>LecFaka Store</span>
                </div>
                <p class="footer-text">&copy; 2025 LecFaka. 保留所有权利。</p>
            </div>
        </div>
    </footer>

    <script src="/static/js/store.js"></script>
</body>
</html>
